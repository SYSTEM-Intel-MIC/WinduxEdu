# WinduxEdu 教育版设置: system defaults (read after ~/.config/winduxedu/edu-settings.conf).
#   screen-keyboard=1        输入文字时自动弹出屏幕键盘（登录界面同样生效）
#   seewo-autostart=1        登录后自动打开希沃管家窗口（建议希沃一体机开启，其它设备关闭）。
#                            只控制 /etc/xdg/autostart 的窗口；hugo_launcher 后端
#                            服务常开，否则从开始菜单打开希沃管家会报
#                            "Cannot read property 'data' of undefined"。
#   sidebar-autostart=0      第三方侧边栏 sidebar + UDI 依赖开机自启
#   touch-calibration=...    触屏坐标变换矩阵，winduxedu-touch-calibrate 写入
# The three switches default to 0 (off); a value present in the per-user file
# always wins over the line here.
screen-keyboard=0
seewo-autostart=0
sidebar-autostart=0
touch-calibration=1 0 0 0 1 0 0 0 1
