# WinduxEdu touchscreen InputClass.
#
# Interactive panels commonly ship a vendor xorg snippet that disables the
# touch node, and a disabled node means no touch device at all: the pointer
# stays in the middle of the screen and xinput_calibrator finds nothing to
# calibrate.  This class is matched after the stock 40-libinput.conf and only
# re-enables what an earlier snippet switched off; per-device mapping to an
# output and any user calibration are applied at session start by
# /usr/local/bin/winduxedu-touch-fix (xinput cannot be expressed reliably as a
# static InputClass option).
Section "InputClass"
    Identifier "WinduxEdu touchscreen"
    MatchIsTouchscreen "on"
    Option "Ignore" "false"
    Option "SendEvents" "enabled"
EndSection
