# WinduxEdu X server flags.
#
# Hotplug is not a nicety on an interactive panel: the touch node is added by
# udev at runtime, so a ServerFlags section anywhere in the parse order that
# turns AutoAddDevices (or AutoEnableDevices) off leaves the keyboard working
# and the touchscreen entirely absent.  Both flags default to true, so this
# section is a statement of intent as much as a defence -- it is written last
# in /etc/X11/xorg.conf.d, which is parsed after the system directory, and the
# input normalisation hook rewrites the same pair in a vendor-supplied
# /etc/X11/xorg.conf (the main file is parsed after every conf.d directory and
# would otherwise win).
Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
EndSection
