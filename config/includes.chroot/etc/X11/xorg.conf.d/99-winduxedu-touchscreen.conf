# WinduxEdu touchscreen InputClass.
#
# Touch reaches X through two independent gates and an interactive panel can
# fail either one:
#
#   * the X server only creates a device for nodes libudev tagged ID_INPUT,
#     and libinput only accepts an absolute device libudev also tagged as a
#     touchscreen.  A panel whose HID descriptor describes its touch interface
#     as an absolute pointer is tagged ID_INPUT_MOUSE instead, libinput then
#     refuses it, and touch is dead while the keyboard keeps working;
#   * "Option Ignore" is decided by the *last* matching InputClass, so a
#     vendor snippet that disables the touch node wins simply by sorting after
#     ours.  This file is 99- for exactly that reason, and the main
#     /etc/X11/xorg.conf (parsed after every conf.d directory) is checked for
#     the same trick by the input normalisation hook.
#
# The name-keyed section is the rescue path for the first case: the device
# name is the only handle left once libudev got the tag wrong.  The paired
# udev rule in /etc/udev/rules.d re-tags those nodes as touchscreens, so both
# halves of this file light up the same devices.
#
# Per-device mapping to an output and any user calibration are applied at
# session start by /usr/local/bin/winduxedu-touch-fix (xinput cannot be
# expressed reliably as a static InputClass option).

Section "InputClass"
    Identifier "WinduxEdu touchscreen (libudev tagged)"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "Ignore" "false"
    Option "SendEvents" "enabled"
EndSection

Section "InputClass"
    Identifier "WinduxEdu touchscreen (matched by name)"
    # MatchProduct is a case-sensitive substring test (xf86Xinput.c
    # match_substring uses strstr), so all three spellings have to be listed
    # on one Match line -- within a line the values are ORed, separate Match
    # lines would be ANDed.  This is the rescue path for a panel libudev
    # classified as an absolute pointer: the tag is missing, so the device
    # name is the only handle left.
    MatchProduct "touch" "Touch" "TOUCH"
    MatchIsKeyboard "false"
    MatchIsTouchpad "false"
    Driver "libinput"
    Option "Ignore" "false"
    Option "SendEvents" "enabled"
EndSection
