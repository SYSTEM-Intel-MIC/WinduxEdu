---
name: Build WinduxEdu Live ISO

on:
  push:
    branches: [main, winduxedu-1.0-integration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winduxedu-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build WinduxEdu LiveCD and installer image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Free runner disk space
        # Hosted ubuntu-24.04 images ship ~60 GB of preinstalled toolchains
        # (Android SDK, .NET, GHC, CodeQL, ...) and leave only ~10 GB free.
        # live-build's chroot + binary rootfs + squashfs peak above 20 GB,
        # so drop everything this build cannot possibly use before checkout.
        run: |
          set -euxo pipefail
          for d in \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/rustup \
            /usr/local/cargo \
            /usr/local/go \
            /usr/local/share/boost \
            /usr/local/share/vcpkg \
            /usr/local/share/powershell \
            /usr/local/graalvm \
            /usr/local/rvm \
            /usr/share/miniconda \
            /opt/microsoft \
            /opt/az \
            /opt/hostedtoolcache \
            /snap
          do
            sudo rm -rf "$d" 2>/dev/null || true
          done
          sudo apt-get clean || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore locked component source cache
        uses: actions/cache@v4
        with:
          path: artifacts/source-cache
          key: winduxedu-component-sources-${{ runner.os }}-${{ hashFiles('packages/sources.lock.tsv') }}
          restore-keys: |
            winduxedu-component-sources-${{ runner.os }}-

      - name: Show host capacity
        run: |
          df -h /
          free -h

      - name: Install live-build host tooling
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Avoid the intermittently stalled Azure Ubuntu mirror on hosted
          # runners; replace all runner sources with a minimal public archive
          # configuration for deterministic setup.
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat <<'EOF' | sudo tee /etc/apt/sources.list
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF
          # GitHub-hosted runners occasionally stall on a transient mirror
          # connection; fail fast and retry instead of consuming the whole job.
          sudo timeout 12m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update
          sudo timeout 12m apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin isolinux syslinux syslinux-common syslinux-utils mtools dosfstools gpg cpio jq initramfs-tools-core socat qemu-system-x86 ovmf desktop-file-utils
          lb --version
          docker --version

      - name: Build fixed WinduxEdu 1.0 component packages in Debian Bookworm
        run: |
          set -euxo pipefail
          # ElevenDE and the original Go/C/Qt components use the fixed Go image.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            golang:1.24-bookworm \
            bash ./scripts/build-winduxedu-components.sh
          # The audited Rust desktop tools use a modern Cargo image.  Keeping
          # this separate avoids silently downgrading their Cargo.lock format.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            rust:1.95-bookworm \
            bash ./scripts/build-winduxedu-extra-components.sh
          # Recipes run as root in their Debian containers; return the workspace
          # artifacts to the runner user before writing manifests and cache data.
          sudo chown -R "$USER:$USER" artifacts
          ( cd artifacts/packages && sha256sum *.deb > SHA256SUMS )
          python3 scripts/write-winduxedu-build-manifest.py
          test -f artifacts/packages/elevende_3.6_amd64.deb
          test -f artifacts/packages/winduxedu-store_2.3.0+winduxedu2_amd64.deb
          test -f artifacts/packages/SHA256SUMS
          ( cd artifacts/packages && sha256sum -c SHA256SUMS )
          bash scripts/validate-winduxedu-component-packages.sh
          # The workspace artifacts are staged next; the pulled toolchain
          # images (golang/rust bookworm, several GB) are no longer needed.
          docker image prune -af || true
          df -h /

      - name: Stage verified WinduxEdu 1.0 packages and hooks
        run: |
          set -euxo pipefail
          sudo ROOT="$GITHUB_WORKSPACE" PKGS="$GITHUB_WORKSPACE/artifacts/packages" \
            bash scripts/stage-winduxedu-live-inputs.sh
          ls -lh config/includes.chroot/opt/winduxedu/packages
          find config/hooks -maxdepth 1 -name '*.chroot' -type f -printf '%f\n' | sort
          # Reassemble and double-verify the collected proprietary teaching
          # DEBs into the chroot tree.  Chroot hook 1550 installs them and
          # deletes the staged copies before the squashfs is produced.  Run as
          # root: the staging script above already created the parent
          # opt/winduxedu/ directories root-owned via install -d.
          sudo python3 scripts/assemble-edu-debs.py \
            --output config/includes.chroot/opt/winduxedu/edu-packages
          # 8 collected teaching applications + 7 sidebar components
          # (希沃侧边栏, its UDI hotspot dependency and five 希沃 miniapps,
          # among them 桌面批注).
          test "$(find config/includes.chroot/opt/winduxedu/edu-packages \
            -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 15
          ls -lh config/includes.chroot/opt/winduxedu/edu-packages
          # The proprietary source parts are only inputs to this staging step;
          # freeing ~1.7 GB gives the chroot/squashfs phases enough headroom.
          sudo rm -rf edu-software
          df -h /

      - name: Configure WinduxEdu live-build image
        run: |
          set -euxo pipefail
          # Field report item 6 (apt offered every component twice) could not be
          # reproduced -- the evidence had already been deleted before it
          # reached us -- so the lasting fix is this guard: apt gets exactly
          # one source of truth.  A committed config/apt/sources.list is
          # *appended to* by live-build and reintroduces the old
          # "configured multiple times ... sources.list:8" warning, and any
          # extra config/archives list does the same.
          # Security is now handled natively by live-build with the correct
          # mirror (debian-security) and suite (bookworm-security), so no
          # extra config/archives list is needed.
          if [ -e config/apt/sources.list ]; then
            echo "duplicate apt source: config/apt/sources.list must not exist" >&2
            exit 1
          fi
          if [ -d config/archives ]; then
            for extra in config/archives/*; do
              [ -e "$extra" ] || continue
              case "$(basename "$extra")" in
                winduxedu.list.binary) ;;
                *)
                  echo "duplicate apt source: unexpected file in config/archives: $extra" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          sudo rm -rf lb .build stage cache auto chroot binary binary.tmp *.iso build.log 2>/dev/null || true
          # The rootfs squashfs is compressed with xz: Ubuntu's legacy live-build
          # 3.0~a57 hard-codes "-comp xz" in lb_binary_rootfs and has no
          # --chroot-squashfs-compression-type option, while the now-deleted
          # scripts/prepare-winduxedu-live-build-compression.sh used to patch
          # that stanza to gzip.  --compression only picks the tarball
          # compressor, whose accepted values here are bzip2|gzip|lzip|none.
          # --security false prevents live-build from generating its own (deprecated
          # bookworm/updates) security line; we add the correct bookworm-security
          # line via config/archives/winduxedu.list.binary (binary phase only, to
          # avoid "configured multiple times" warnings from duplicate suite entries).
          sudo lb config \
            --ignore-system-defaults \
            --mode debian \
            --initramfs live-boot \
            --initsystem systemd \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --archive-areas "main contrib non-free non-free-firmware" \
            --security false \
            --mirror-debian "http://deb.debian.org/debian" \
            --keyring-packages "debian-archive-keyring" \
            --binary-images iso-hybrid \
            --compression gzip \
            --bootappend-live "components splash console=ttyS0,115200n8" \
            --iso-application "WinduxEdu Live" \
            --iso-publisher "SYSTEM-Intel-MIC" \
            --iso-volume "WinduxEdu 1.0" \
            --source false \
            --zsync false \
            --firmware-chroot false \
            --apt-recommends false \
            --debian-installer false

          # Every WinduxEdu helper must be executable inside the image, not
          # only the handful that used to be listed one by one: the education
          # settings page, the touchscreen calibrator, the on-screen keyboard
          # and the Seewo toolbar are started through QProcess::start() and
          # silently return empty on EACCES when their git mode stays 644.
          sudo chmod 755 config/hooks/*.chroot \
            config/includes.chroot/usr/local/bin/* \
            config/includes.chroot/usr/local/sbin/* \
            config/includes.chroot/usr/local/libexec/*

          sudo mkdir -p config/archives
          # live-build's --security false skips the deprecated bookworm/updates line.
          # Add the correct bookworm-security line for the binary (installed image) only.
          # Using .binary (not .chroot) avoids "configured multiple times" warnings
          # because live-build's generated sources.list has bookworm + bookworm-updates,
          # and this adds only bookworm-security (different suite, no duplicate).
          cat <<'EOF' | sudo tee config/archives/winduxedu.list.binary
          deb [arch=amd64,i386] http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF
          # live-build still calls apt-get --force-yes for its chroot upgrade,
          # which apt has deprecated since 2.0 and prints a warning for on
          # every upgrade pass.  Rewrite only that flag wherever live-build
          # uses it, keeping the rest of each command line untouched.
          # The step runs under `set -o pipefail`, so the grep inside this
          # loop must not be the thing that decides the exit status: it exits 1
          # whenever a directory simply does not contain the flag (live-build
          # keeps it in one of the three roots, not all of them), which failed
          # the whole configure step on its own.
          for dir in /usr/share/live /usr/lib/live /usr/share/live-build; do
            [ -d "$dir" ] || continue
            force_yes_files="$(sudo grep -rl -- '--force-yes' "$dir" 2>/dev/null || true)"
            if [ -z "$force_yes_files" ]; then
              continue
            fi
            while IFS= read -r f; do
              if [ -n "$f" ]; then
                sudo sed -i \
                  's/--force-yes/--allow-downgrades --allow-remove-essential --allow-change-held-packages --allow-unauthenticated/g' \
                  "$f"
              fi
            done <<< "$force_yes_files"
          done
          # Keep isolinux.bin and every COM32 runtime module from the same
          # syslinux package. In particular, isolinux.cfg -> vesamenu.c32
          # requires ldlinux.c32, libcom32.c32 and libutil.c32 at boot time.
          sudo cp -f /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          sudo cp -f /usr/lib/syslinux/modules/bios/*.c32 config/bootloaders/isolinux/
          test -s config/bootloaders/isolinux/isolinux.bin
          test -s config/bootloaders/isolinux/ldlinux.c32
          test -s config/bootloaders/isolinux/libcom32.c32
          test -s config/bootloaders/isolinux/libutil.c32
          test -s config/bootloaders/isolinux/vesamenu.c32
          sudo find config -maxdepth 4 -type f -printf '%p\n' | sort | head -200

      - name: Build WinduxEdu ISO
        run: |
          set -euxo pipefail
          echo "WinduxEdu build started: $(date --iso-8601=seconds)" | tee build.log
          # Rootfs squashfs compression.  live-build only ever appends its
          # hard-coded "-comp xz", so mksquashfs keeps its 128 KiB default block
          # and dictionary, and this ~13 GB rootfs lands above the ISO9660
          # 4 GiB-1 per-file limit (/live/filesystem.squashfs is that file).
          # lb_binary_rootfs expands MKSQUASHFS_OPTIONS on the host before it is
          # passed into the chroot, so exporting it tunes the compressor without
          # patching live-build: 512 KiB blocks/dictionary plus the x86 BCJ
          # filter measured 7.9% smaller than the defaults on a comparable
          # rootfs tree.  "-comp xz" is repeated first so a squashfs-tools build
          # that validates -X options eagerly still sees the right compressor;
          # Debian bookworm's kernel has CONFIG_XZ_DEC_X86=y, so the filter is
          # decoded at boot.
          sudo env MKSQUASHFS_OPTIONS="-comp xz -b 524288 -Xdict-size 524288 -Xbcj x86" \
            lb build 2>&1 | tee -a build.log

          # Use the same repack implementation locally and in CI. It retains the
          # matching ISOLINUX tree and injects an x86_64 EFI System Partition.
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*WinduxEdu*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          # ISO9660 level 1/2 -- what `xorriso -as mkisofs` defaults to for both
          # live-build and scripts/repack-winduxedu-dualboot-iso.sh -- cannot
          # address a file of 4 GiB - 1, and /live/filesystem.squashfs is exactly
          # that kind of file.  The integrated teaching applications grow the
          # rootfs every release, so check explicitly and fail with a readable
          # message rather than an opaque xorriso error.
          ISO_BYTES="$(stat -c %s "$ISO_SOURCE")"
          if [ "$ISO_BYTES" -ge 4294967296 ]; then
            echo "ISO is ${ISO_BYTES} bytes, at or above the 4 GiB ISO9660 limit; shrink the rootfs or split the package set" >&2
            exit 1
          fi
          echo "ISO size check passed: ${ISO_BYTES} bytes (< 4 GiB)" | tee -a build.log
          chmod 755 scripts/repack-winduxedu-dualboot-iso.sh
          WINDUXEDU_BINARY_TREE="$GITHUB_WORKSPACE/binary" \
            bash scripts/repack-winduxedu-dualboot-iso.sh "$ISO_SOURCE" 2>&1 | tee -a build.log
          ISO_BYTES="$(stat -c %s "$ISO_SOURCE")"
          if [ "$ISO_BYTES" -ge 4294967296 ]; then
            echo "Repacked ISO is ${ISO_BYTES} bytes, at or above the 4 GiB ISO9660 limit" >&2
            exit 1
          fi
          echo "WinduxEdu dual BIOS/UEFI ISO finished: $(date --iso-8601=seconds)" | tee -a build.log

      - name: Diagnose rootfs size
        # Runs only after a failure, while the chroot is still on disk (the
        # cleanup step at the end of the job wipes it).  When the rootfs
        # outgrows the ISO9660 4 GiB-1 per-file limit, genisoimage aborts on
        # /live/filesystem.squashfs without saying which part of the rootfs to
        # trim, so print the size breakdown here instead.
        if: failure()
        run: |
          set -uo pipefail
          sudo du -x -m --max-depth=3 chroot/chroot 2>/dev/null | sort -n | tail -80 || true
          sudo du -x -m chroot/chroot/var/cache/apt/archives \
            chroot/chroot/var/lib/apt/lists \
            chroot/chroot/usr/share/doc \
            chroot/chroot/usr/share/man \
            chroot/chroot/usr/share/locale 2>/dev/null || true
          df -h / || true

      - name: Verify WinduxEdu ISO
        id: iso
        run: |
          set -euxo pipefail
          ISO_SOURCE="$(find . -maxdepth 2 -type f \( -name '*WinduxEdu*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$ISO_SOURCE"
          test -s "$ISO_SOURCE"
          ISO="WinduxEdu-1.0-amd64-livecd.iso"
          mv "$ISO_SOURCE" "$ISO"
          test -s "$ISO"
          echo "iso_path=$ISO" >> "$GITHUB_OUTPUT"
          # Inspect the final ISO rather than trusting the live-build log.
          xorriso -indev "$ISO" -report_el_torito plain 2>&1 | tee iso-boot-report.txt
          BOOT_CHECK="$(mktemp -d)"
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/ldlinux.c32 "$BOOT_CHECK/ldlinux.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /isolinux/vesamenu.c32 "$BOOT_CHECK/vesamenu.c32" >/dev/null 2>&1
          xorriso -osirrox on -indev "$ISO" -extract /efi.img "$BOOT_CHECK/efi.img" >/dev/null 2>&1
          test -s "$BOOT_CHECK/ldlinux.c32"
          test -s "$BOOT_CHECK/vesamenu.c32"
          test -s "$BOOT_CHECK/efi.img"
          # Inspect the compressed target filesystem for installer-critical files.
          ROOT_CHECK="$(mktemp -d)"
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs "$ROOT_CHECK/filesystem.squashfs" >/dev/null 2>&1
          unsquashfs -l "$ROOT_CHECK/filesystem.squashfs" > "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/bin/unsquashfs$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/bin/rsync$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/lib/.*/calamares/modules/partition/libcalamares_viewmodule_partition.so$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/lib/.*/calamares/modules/mount/module.desc$' "$ROOT_CHECK/squashfs.list"
          grep -q '/etc/calamares/branding/winduxedu/show.qml$' "$ROOT_CHECK/squashfs.list"
          grep -q '/etc/calamares/branding/winduxedu/stylesheet.qss$' "$ROOT_CHECK/squashfs.list"
          grep -q '/usr/local/share/elevende-shell/icons/64x64/apps/winduxedu-installer.svg$' "$ROOT_CHECK/squashfs.list"
          rm -rf "$BOOT_CHECK" "$ROOT_CHECK"
          grep -q -E 'El Torito boot img.*BIOS|El Torito boot img.*UEFI|EFI|efi.img|isolinux' iso-boot-report.txt
          chmod 755 scripts/validate-winduxedu-live-image.sh
          sudo bash scripts/validate-winduxedu-live-image.sh "$ISO"
          sha256sum "$ISO" | tee WinduxEdu-1.0-amd64-livecd.iso.sha256
          # GitHub caps a single Release asset at 2 GiB while total Release
          # size stays unlimited.  Once the integrated teaching apps push the
          # ISO past the cap, publish it as raw byte-split volumes (joinable
          # with 7-Zip, `copy /b` or `cat`); below the cap upload one file.
          SPLIT_NOTE=""
          ISO_BYTES="$(stat -c %s "$ISO")"
          if [ "$ISO_BYTES" -ge 2147483648 ]; then
            split -b 1900M --numeric-suffixes=1 --suffix-length=3 "$ISO" "${ISO}."
            sha256sum "${ISO}".??? > WinduxEdu-1.0-amd64-livecd.iso.parts.sha256
            ls -lh "${ISO}".??? WinduxEdu-1.0-amd64-livecd.iso.parts.sha256
            SPLIT_NOTE="$(cat <<'NOTE'
          ## Split ISO volumes (why + how to join)

          This ISO exceeds GitHub's 2 GiB single-asset limit, so it is published
          as raw byte-split volumes: sequential bytes of one ISO, no packing or
          compression step.

          - Windows: `copy /b WinduxEdu-1.0-amd64-livecd.iso.001+WinduxEdu-1.0-amd64-livecd.iso.002 WinduxEdu-1.0-amd64-livecd.iso`
          - Linux/macOS: `cat WinduxEdu-1.0-amd64-livecd.iso.001 WinduxEdu-1.0-amd64-livecd.iso.002 > WinduxEdu-1.0-amd64-livecd.iso`
          - 7-Zip / WinRAR: open the `.001` volume and extract the full ISO directly.

          Verify the volumes, join them, then verify the joined ISO before
          writing it to USB with Rufus/Etcher:

          ```sh
          sha256sum -c WinduxEdu-1.0-amd64-livecd.iso.parts.sha256
          sha256sum -c WinduxEdu-1.0-amd64-livecd.iso.sha256
          ```

          README section "下载、拼接与安装（Release 资产说明）" has the full guide.
          NOTE
          )"
          fi
          # Build the release asset list only from files that exist so the
          # release action never sees an unmatched glob.  The joined ISO itself
          # must stay off the list whenever it was split: a Release asset over
          # 2147483648 bytes is rejected by the API, and the volumes already
          # carry everything needed to reconstruct it.
          {
            echo "release_files<<RELEASE_FILES_EOF"
            if [ "$ISO_BYTES" -lt 2147483648 ]; then
              printf '%s\n' "$ISO"
            fi
            printf '%s\n' 'WinduxEdu-1.0-amd64-livecd.iso.sha256'
            if [ -f WinduxEdu-1.0-amd64-livecd.iso.parts.sha256 ]; then
              printf '%s\n' "${ISO}".??? 'WinduxEdu-1.0-amd64-livecd.iso.parts.sha256'
            fi
            printf '%s\n' 'WinduxEdu-1.0-release-notes.md'
            echo "RELEASE_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
          cat > WinduxEdu-1.0-release-notes.md <<EOF
          # WinduxEdu 1.0 Preview — LiveCD with installer

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          This hybrid ISO includes the ElevenDE desktop, WinduxEdu boot and installer branding,
          Chinese Fcitx5 input support, Microsoft Edge, VLC, Image Viewer, PeaZip, WinduxEdu Store,
          the Matchbox touch keyboard from the Debian Bookworm archive,
          automatic USB media autorun that opens an inserted stick in the file manager,
          double-click .exe launching through Wine, and touch-screen calibration,
          the maximum-compatibility firmware/driver set, Windows-style system tools built
          from the locked package layer, and the collected proprietary teaching applications
          installed from edu-software/: ONLYOFFICE, DingTalk, QQ, WeChat, Seewo EasiNote,
          EasiCare, EasiCamera and Seewo Terminal Manager (希沃管家). The terminal
          manager's hugo_launcher backend stays enabled so its window works out of the box;
          only its login-time popup is controlled by 教育版设置 → 希沃管家开机自启.

          Verify the ISO before writing it to USB:

          \`\`\`sh
          sha256sum -c WinduxEdu-1.0-amd64-livecd.iso.sha256
          \`\`\`

          ${SPLIT_NOTE}
          EOF
          ls -lh "$ISO" WinduxEdu-1.0-amd64-livecd.iso.sha256 WinduxEdu-1.0-release-notes.md build.log

      - name: Diagnose ISO verification
        # Runs only after a failure.  The verifier stops at the first problem it
        # finds, and every problem it has not reached yet would otherwise cost
        # another full build to discover.  Re-open the finished squashfs and
        # print the remaining suspects -- PDF handler registration, DingTalk's
        # bundled libraries and session/power desktop entries -- in one pass.
        if: failure()
        run: |
          set -uo pipefail
          SQUASH="$(find binary -name filesystem.squashfs -type f 2>/dev/null | head -n1 || true)"
          if [ -z "$SQUASH" ]; then
            ISO_GUESS="$(find . -maxdepth 2 -name '*.iso' -type f 2>/dev/null | head -n1 || true)"
            [ -n "$ISO_GUESS" ] || { echo 'no squashfs and no ISO left to diagnose'; exit 0; }
            SQUASH=/tmp/filesystem.squashfs
            sudo xorriso -osirrox on -indev "$ISO_GUESS" -extract /live/filesystem.squashfs "$SQUASH" >/dev/null 2>&1 || {
              echo 'could not extract the squashfs from the ISO'; exit 0; }
          fi
          DIAG=/tmp/winduxedu-verify-diag
          sudo rm -rf "$DIAG"
          sudo unsquashfs -d "$DIAG" "$SQUASH" \
            'etc/xdg/mimeapps.list' \
            'usr/share/applications/*' \
            'usr/local/share/applications/*' \
            'opt/apps/com.alibabainc.dingtalk/*' >/dev/null 2>&1 || true

          echo '===== application/pdf defaults ====='
          sudo grep -R --include='mimeapps.list' '^application/pdf=' "$DIAG/etc" 2>/dev/null || echo 'no application/pdf entry anywhere'
          echo '===== ONLYOFFICE desktop MimeType ====='
          sudo grep -R --include='*.desktop' -H '^MimeType=' "$DIAG/usr" 2>/dev/null | grep -i onlyoffice || echo 'no ONLYOFFICE desktop with a MimeType line'

          echo '===== DingTalk files layout ====='
          sudo find "$DIAG/opt/apps/com.alibabainc.dingtalk/files" -maxdepth 2 2>/dev/null | sort | head -80 || echo 'no DingTalk files tree'
          echo '===== DingTalk stale bundled libraries ====='
          sudo find "$DIAG/opt/apps/com.alibabainc.dingtalk/files" \
            \( -name 'libm.so.6' -o -name 'libstdc++.so.6*' -o -name 'libgbm.so*' \
               -o -name 'libGLX.so*' -o -name 'libGLdispatch.so*' \) \
            \( -type f -o -type l \) -print 2>/dev/null || true

          echo '===== forbidden session/power desktop entries (Name/Comment) ====='
          sudo grep -rEiH \
            '^(Name|Name\[zh_CN\]|GenericName|Comment)=.*(Shutdown|Shut Down|Power Off|Restart|Reboot|Log ?Out|Logoff|Logout|Suspend|Sleep|Hibernate|Lock Screen|Lock Session|关机|重启|重新启动|注销|登出|睡眠|挂起|休眠|锁屏|锁定)' \
            "$DIAG/usr/share/applications" "$DIAG/usr/local/share/applications" 2>/dev/null || echo 'none'
          echo '===== forbidden session/power desktop entries (Exec) ====='
          sudo grep -rEiH \
            '^Exec=.*(systemctl[[:space:]]+(poweroff|reboot|suspend|hibernate)|loginctl[[:space:]]+(poweroff|reboot|suspend|hibernate|terminate-session|lock-session)|lxqt-leave|xfce4-session-logout|mate-session-save|openbox[[:space:]]+--exit|gnome-session-quit|(^|[[:space:]])(poweroff|reboot|shutdown|logout|logoff|xscreensaver-command|dm-tool)[[:space:]])' \
            "$DIAG/usr/share/applications" "$DIAG/usr/local/share/applications" 2>/dev/null || echo 'none'

          sudo rm -rf "$DIAG"
          df -h / || true

      - name: Smoke boot WinduxEdu 1.0 ISO in QEMU BIOS and UEFI
        run: |
          set -euxo pipefail
          # Hosted runners expose /dev/kvm but not to the unprivileged runner
          # user; opening it lets the smoke boot use hardware virtualization
          # (ordered -accel kvm -accel tcg in the script still falls back).
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          chmod 755 scripts/qemu-boot-smoke.sh scripts/validate-winduxedu-live-image.sh
          bash scripts/qemu-boot-smoke.sh "${{ steps.iso.outputs.iso_path }}" bios 420
          bash scripts/qemu-boot-smoke.sh "${{ steps.iso.outputs.iso_path }}" uefi 420

      # No actions/upload-artifact steps: the free plan's 500 MB artifact
      # quota cannot hold the ISO (run #48 went red on
      # "Artifact storage quota has been hit" after a green build), and the
      # component DEBs are far larger still.  Everything worth distributing
      # ships as a Preview Release asset below, so the quota stays reserved
      # for the diagnostics frames a release cannot carry.

      - name: Publish WinduxEdu 1.0 Preview Release
        # Every green build (push or manual dispatch) publishes a tagged
        # pre-release once the ISO verifier and both BIOS/UEFI QEMU smoke
        # checks succeed.
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: winduxedu-1.0-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: WinduxEdu 1.0 Preview Build ${{ github.run_number }}
          body_path: WinduxEdu-1.0-release-notes.md
          prerelease: true
          files: ${{ steps.iso.outputs.release_files }}

      - name: Cleanup runner disk
        if: always()
        run: |
          sudo rm -rf lb .build stage cache chroot binary binary.tmp artifacts/work 2>/dev/null || true
          df -h /
